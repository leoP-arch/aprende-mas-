<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende + | UNACH</title>
    <!-- Importación de tipografía Playfair (usada en el resto del sitio) -->
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos específicos para la animación de bienvenida */
        body.loading-screen {
            background-color: #FAF7F2; /* Fondo crema minimalista de la paleta */
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .loading-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            max-width: 90%;
        }

        /* 1. Animación del logotipo (giro sutil, escalado y entrada) */
        .loading-logo {
            max-width: 220px;
            height: auto;
            opacity: 0;
            transform: scale(0.6) rotate(-5deg);
            animation: showLogo 1.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            filter: drop-shadow(0px 8px 16px rgba(44, 34, 30, 0.15));
        }

        /* 2. Animación de textos principales */
        .welcome-text {
            opacity: 0;
            transform: translateY(15px);
            animation: slideUp 1s ease-out 0.8s forwards;
        }

        .welcome-text h1 {
            font-family: 'Playfair Display', serif;
            color: #2C221E; /* Espresso de la paleta */
            font-size: 2.5rem;
            margin: 0 0 5px 0;
            letter-spacing: 0.5px;
        }

        .welcome-text h1 span.plus {
            color: #9C6644; /* Dorado/Terracota institucional */
        }

        .welcome-text p {
            color: #7A6A63; /* Moka de la paleta */
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin: 0;
        }

        /* 3. Indicador de carga animado tipo órbita UNACH */
        .loader-wrapper {
            margin-top: 10px;
            opacity: 0;
            animation: fadeIn 0.8s ease-in 1.2s forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3.5px solid rgba(156, 102, 68, 0.15); /* Color acento apagado */
            border-top-color: #9C6644; /* Oro/Acento UNACH */
            border-radius: 50%;
            animation: spin 1.1s linear infinite;
        }

        .loading-msg {
            font-size: 0.85rem;
            color: #7A6A63;
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: pulseText 1.5s infinite ease-in-out;
        }

        /* Keyframes de las animaciones */
        @keyframes showLogo {
            0% {
                opacity: 0;
                transform: scale(0.6) rotate(-8deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Transición de salida de pantalla antes de redireccionar */
        .fade-out-active {
            animation: fadeOutView 0.5s ease-in-out forwards !important;
        }

        @keyframes fadeOutView {
            0% { opacity: 1; transform: scale(1); filter: blur(0px); }
            100% { opacity: 0; transform: scale(0.96); filter: blur(4px); }
        }

        /* Ajustes Mobile */
        @media screen and (max-width: 600px) {
            .loading-logo { max-width: 170px; }
            .welcome-text h1 { font-size: 2rem; }
            .welcome-text p { font-size: 0.85rem; }
        }
    </style>
</head>
<body class="loading-screen">

    <div class="loading-container" id="loadingContainer">
        <!-- Logotipo UNACH transparente -->
        <img src="Logo_unach.png" alt="Logo UNACH Aprende +" class="loading-logo">

        <!-- Textos de entrada -->
        <div class="welcome-text">
            <h1>Aprende<span class="plus">+</span></h1>
            <p>Educación Secundaria</p>
        </div>

        <!-- Indicador visual e interactivo de carga -->
        <div class="loader-wrapper">
            <div class="spinner"></div>
            <span class="loading-msg">Iniciando plataforma...</span>
        </div>
    </div>

    <script>
        // Transición y redireccionamiento automatizado
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('loadingContainer');
            
            // Tiempo de permanencia total: 4.5 segundos antes de redirigir
            setTimeout(() => {
                // Agregar clase de desvanecimiento suave (fade out)
                container.classList.add('fade-out-active');
                
                // Redirigir un instante después de terminar la animación de salida
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 450); 
                
            }, 4000); // 4 segundos cargando animaciones de entrada + 0.5s de salida
        });
    </script>
</body>
</html>
